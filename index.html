<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Studio Rafaela — Controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- Google Identity Services (pra Drive, quando a conta for definida) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root{
    --ink:#211d1b;
    --paper:#faf6f1;
    --surface:#ffffff;
    --blush:#f3e3dc;
    --wine:#8a3a42;
    --wine-dark:#6e2e35;
    --gold:#b08a4e;
    --line:#e7ddd3;
    --muted:#8a7f76;
    --ok:#3f7d54;
    --warn:#b3762c;
    --danger:#a13b3b;
    --radius:14px;
    --shadow: 0 2px 10px rgba(33,29,27,0.06), 0 1px 2px rgba(33,29,27,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* Layout */
  .app{display:flex;min-height:100vh;}
  nav.side{
    width:220px;background:var(--ink);color:#f2ece6;padding:28px 18px;
    display:flex;flex-direction:column;gap:6px;position:fixed;top:0;bottom:0;
  }
  nav.side .brand{font-family:'Playfair Display',serif;font-size:22px;font-style:italic;margin-bottom:28px;color:#fff;}
  nav.side .brand span{color:var(--gold);}
  nav.side button{
    background:none;border:none;color:#cfc4ba;text-align:left;padding:11px 12px;border-radius:10px;
    font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:10px;transition:.15s;
  }
  nav.side button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  nav.side button.active{background:var(--wine);color:#fff;}

  .side-footer{
    margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .side-footer img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold);}
  .side-footer div{display:flex;flex-direction:column;line-height:1.3;}
  .side-footer b{color:#fff;font-size:13.5px;}
  .side-footer span{color:#9c9088;font-size:11.5px;}

  .hero{
    display:flex;background:linear-gradient(135deg,var(--blush),var(--paper));
    border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow);
    min-height:200px;
  }
  .hero-text{flex:1;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;}
  .hero-text .eyebrow{color:var(--wine);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .hero-text h2{font-size:32px;margin:0 0 6px;font-style:italic;color:var(--ink);}
  .hero-text p{margin:0;color:var(--muted);font-size:14px;}
  .hero-photo{width:220px;flex-shrink:0;position:relative;}
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
  @media (max-width:700px){ .hero-photo{display:none;} }

  main{margin-left:220px;flex:1;padding:32px 40px 100px;max-width:980px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:26px;margin:0;font-weight:700;}
  .topbar .sub{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .month-picker{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;}
  .month-picker input{border:none;outline:none;background:none;font-weight:600;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .card .value{font-size:24px;font-weight:700;}
  .card.wine .value{color:var(--wine);}
  .card.ok .value{color:var(--ok);}
  .card.warn .value{color:var(--warn);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:22px;}
  .panel h3{margin:0 0 16px;font-size:17px;font-weight:700;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

  .btn{background:var(--wine);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;}
  .btn:hover{background:var(--wine-dark);}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn.danger{background:none;color:var(--danger);border:1px solid #e6cccc;}

  table{width:100%;border-collapse:collapse;font-size:13.8px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .tag.pago{background:#e3f1e6;color:var(--ok);}
  .tag.pendente{background:#faeada;color:var(--warn);}
  .tag.depois{background:#f1e6e6;color:var(--danger);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid.wide{grid-template-columns:1fr;}
  label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--paper);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--wine);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:10px 0;}
  .checkline input{width:auto;}

  .item-row{display:grid;grid-template-columns:1.3fr 0.8fr 0.9fr auto;gap:10px;align-items:end;margin-bottom:10px;padding:12px;background:var(--blush);border-radius:10px;}
  .item-row .calc{font-weight:700;color:var(--wine);font-size:14px;}
  .remove-item{background:none;border:none;color:var(--danger);font-size:18px;padding:4px;}

  .session-total{display:flex;justify-content:space-between;background:var(--blush);padding:14px 18px;border-radius:10px;margin-top:8px;font-size:15px;}
  .session-total b{color:var(--wine);}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .serif{font-size:19px;color:var(--ink);margin-bottom:6px;}

  .modal-bg{position:fixed;inset:0;background:rgba(33,29,27,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .drivebtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--wine);text-decoration:none;font-weight:600;}

  /* Mobile */
  nav.side.mobile-hidden{display:none;}
  .bottom-nav{display:none;}
  @media (max-width: 880px){
    nav.side{display:none;}
    main{margin-left:0;padding:20px 16px 90px;}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:40;
      justify-content:space-around;padding:8px 4px 14px;
    }
    .bottom-nav button{background:none;border:none;color:#cfc4ba;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;padding:6px 4px;}
    .bottom-nav button.active{color:#fff;}
    .bottom-nav button .dot{width:5px;height:5px;border-radius:50%;background:var(--wine);opacity:0;}
    .bottom-nav button.active .dot{opacity:1;}
    .form-grid{grid-template-columns:1fr;}
    .item-row{grid-template-columns:1fr 1fr;grid-template-areas:"tipo tipo" "qtd calc" "remove remove";}
    .cards{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="app">
  <nav class="side" id="sideNav">
    <div class="brand">studio <span>Rafaela</span></div>
    <button data-view="dashboard" class="nav-btn active">📊 Dashboard</button>
    <button data-view="sessoes" class="nav-btn">📸 Sessões</button>
    <button data-view="clientes" class="nav-btn">👥 Clientes</button>
    <button data-view="bras" class="nav-btn">🌙 Idas ao Brás</button>
    <button data-view="financeiro" class="nav-btn">💰 Financeiro</button>
    <button data-view="config" class="nav-btn">⚙️ Configurações</button>
    <div class="side-footer">
      <img src="rafaela-avatar.jpg" alt="Rafaela">
      <div><b>Rafaela</b><span>Studio Owner</span></div>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="sub" id="viewSub">Visão geral do mês</div>
      </div>
      <div class="month-picker">
        <span>📅</span>
        <input type="month" id="monthFilter">
      </div>
    </div>

    <div id="viewRoot"></div>
  </main>
</div>

<div class="bottom-nav" id="bottomNav">
  <button data-view="dashboard" class="nav-btn active"><span>📊</span>Home<span class="dot"></span></button>
  <button data-view="sessoes" class="nav-btn"><span>📸</span>Sessões<span class="dot"></span></button>
  <button data-view="clientes" class="nav-btn"><span>👥</span>Clientes<span class="dot"></span></button>
  <button data-view="bras" class="nav-btn"><span>🌙</span>Brás<span class="dot"></span></button>
  <button data-view="financeiro" class="nav-btn"><span>💰</span>Financ.<span class="dot"></span></button>
</div>

<!-- Modal genérico -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO — troque pelos dados reais quando definirem
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyClrVEieswoLulthIs95HHNc55MzL9iyTc",
  authDomain: "raffa-controle.firebaseapp.com",
  projectId: "raffa-controle",
  storageBucket: "raffa-controle.firebasestorage.app",
  messagingSenderId: "381295329554",
  appId: "1:381295329554:web:f1f265db68f982fe9133cb"
};
const GOOGLE_CLIENT_ID = "SUA_CHAVE_AQUI"; // preencher quando a conta do Drive for definida

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =========================================================
   ESTADO
   ========================================================= */
let clientes = [];
let sessoes = [];
let idasBras = [];
let currentView = 'dashboard';
let currentMonth = new Date().toISOString().slice(0,7); // YYYY-MM

const PRECO_LOOK = 35;
const PRECO_PACOTE3 = 100;
const PRECO_REELS = 60;
const REPASSE_POR_LOOK = 5;
const VALOR_IDA_BRAS = 100;

/* =========================================================
   CÁLCULO DE PREÇOS (regra de negócio)
   ========================================================= */
function calcularItem(tipo, qtd){
  qtd = Number(qtd)||0;
  let valor = 0, repasse = 0;
  if(tipo === 'avulso'){
    valor = qtd * PRECO_LOOK;
    repasse = qtd * REPASSE_POR_LOOK;
  } else if(tipo === 'pacote3'){
    const grupos = Math.floor(qtd/3);
    const resto = qtd%3;
    valor = grupos*PRECO_PACOTE3 + resto*PRECO_LOOK;
    repasse = qtd * REPASSE_POR_LOOK;
  } else if(tipo === 'reels'){
    valor = qtd * PRECO_REELS;
    repasse = 0; // reels nunca gera repasse pra irmã
  }
  return {valor, repasse};
}

function fmt(v){
  return 'R$ ' + (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* =========================================================
   FIRESTORE — carregar dados em tempo real
   ========================================================= */
function ligarListeners(){
  db.collection('clientes').orderBy('nome').onSnapshot(snap=>{
    clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('sessoes').orderBy('data','desc').onSnapshot(snap=>{
    sessoes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('idasBras').orderBy('data','desc').onSnapshot(snap=>{
    idasBras = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
const titles = {
  dashboard: ['Dashboard','Visão geral do mês'],
  sessoes: ['Sessões','Registro de looks, pacotes e reels'],
  clientes: ['Clientes','Cadastro e pastas do Drive'],
  bras: ['Idas ao Brás','Custo fixo — segunda e terça de madrugada'],
  financeiro: ['Financeiro','Pagamentos, pendências e recebimentos'],
  config: ['Configurações','Drive, backup e ajustes do sistema']
};

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentView = btn.dataset.view;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll(`[data-view="${currentView}"]`).forEach(b=>b.classList.add('active'));
    document.getElementById('viewTitle').textContent = titles[currentView][0];
    document.getElementById('viewSub').textContent = titles[currentView][1];
    render();
  });
});

document.getElementById('monthFilter').value = currentMonth;
document.getElementById('monthFilter').addEventListener('change', e=>{
  currentMonth = e.target.value;
  render();
});

function sessoesDoMes(){
  return sessoes.filter(s=> (s.data||'').slice(0,7) === currentMonth);
}
function idasDoMes(){
  return idasBras.filter(i=> (i.data||'').slice(0,7) === currentMonth);
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  const root = document.getElementById('viewRoot');
  if(currentView==='dashboard') root.innerHTML = renderDashboard();
  if(currentView==='sessoes') root.innerHTML = renderSessoes();
  if(currentView==='clientes') root.innerHTML = renderClientes();
  if(currentView==='bras') root.innerHTML = renderBras();
  if(currentView==='financeiro') root.innerHTML = renderFinanceiro();
  if(currentView==='config') root.innerHTML = renderConfig();
  bindDynamicEvents();
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const sm = sessoesDoMes();
  const im = idasDoMes();
  const faturamento = sm.reduce((a,s)=>a+(s.valorTotal||0),0);
  const repasseIrma = sm.reduce((a,s)=>a+(s.repasseTotal||0),0);
  const custoBras = im.length * VALOR_IDA_BRAS;
  const lucro = faturamento - repasseIrma - custoBras;
  const pendentes = sm.filter(s=>s.statusPagamento!=='pago');
  const emAberto = pendentes.reduce((a,s)=>a+(s.valorTotal||0),0);

  const ultimas = sm.slice(0,6);

  return `
    <div class="hero">
      <div class="hero-text">
        <div class="eyebrow">Bem-vinda de volta</div>
        <h2>Rafaela</h2>
        <p>Visão geral do seu negócio em ${new Date(currentMonth+'-02').toLocaleDateString('pt-BR',{month:'long', year:'numeric'})}.</p>
      </div>
      <div class="hero-photo"><img src="rafaela-hero.jpg" alt="Rafaela"></div>
    </div>

    <div class="cards">
      <div class="card wine"><div class="label">Faturamento do mês</div><div class="value">${fmt(faturamento)}</div></div>
      <div class="card"><div class="label">Repasse à irmã (looks)</div><div class="value">${fmt(repasseIrma)}</div></div>
      <div class="card"><div class="label">Custo fixo — Idas ao Brás</div><div class="value">${fmt(custoBras)}</div></div>
      <div class="card ok"><div class="label">Lucro líquido</div><div class="value">${fmt(lucro)}</div></div>
      <div class="card warn"><div class="label">Em aberto (${pendentes.length} sessões)</div><div class="value">${fmt(emAberto)}</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Últimas sessões</h3><button class="btn small" onclick="abrirNovaSessao()">+ Nova sessão</button></div>
      ${ultimas.length ? `
        <table>
          <tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Valor</th><th>Repasse</th><th>Status</th></tr>
          ${ultimas.map(s=>`
            <tr>
              <td>${fmtData(s.data)}</td>
              <td>${s.clienteNome}</td>
              <td>${(s.itens||[]).map(i=>tipoLabel(i.tipo)+' x'+i.quantidade).join(', ')}</td>
              <td>${fmt(s.valorTotal)}</td>
              <td>${fmt(s.repasseTotal)}</td>
              <td>${statusTag(s.statusPagamento)}</td>
            </tr>`).join('')}
        </table>
      ` : `<div class="empty"><div class="serif">Nenhuma sessão esse mês</div>Registre a primeira sessão pra começar o controle.</div>`}
    </div>
  `;
}

function tipoLabel(t){
  return {avulso:'Look avulso', pacote3:'Pacote 3x', reels:'Reels'}[t] || t;
}
function fmtData(d){
  if(!d) return '-';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function statusTag(s){
  if(s==='pago') return `<span class="tag pago">Pago</span>`;
  if(s==='depois') return `<span class="tag depois">Vai pagar depois</span>`;
  return `<span class="tag pendente">Pendente</span>`;
}

/* ---------- SESSÕES ---------- */
function renderSessoes(){
  const sm = sessoesDoMes();
  return `
    <div class="panel">
      <div class="panel-head"><h3>Sessões do mês</h3><button class="btn" onclick="abrirNovaSessao()">+ Nova sessão</button></div>
      ${sm.length ? `
        <table>
          <tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Irmã?</th><th>Valor</th><th>Repasse</th><th>Status</th><th></th></tr>
          ${sm.map(s=>`
            <tr>
              <td>${fmtData(s.data)}</td>
              <td>${s.clienteNome}</td>
              <td>${(s.itens||[]).map(i=>tipoLabel(i.tipo)+' x'+i.quantidade).join('<br>')}</td>
              <td>${s.irmaParticipou ? 'Sim' : 'Não'}</td>
              <td>${fmt(s.valorTotal)}</td>
              <td>${fmt(s.repasseTotal)}</td>
              <td>${statusTag(s.statusPagamento)}</td>
              <td><button class="btn ghost small" onclick="editarSessao('${s.id}')">Editar</button></td>
            </tr>`).join('')}
        </table>
      ` : `<div class="empty"><div class="serif">Nenhuma sessão registrada esse mês</div>Clique em "Nova sessão" pra lançar o primeiro atendimento.</div>`}
    </div>
  `;
}

let itemCount = 0;
let editingSessionId = null;

function abrirNovaSessao(){
  editingSessionId = null;
  itemCount = 0;
  abrirModalSessao();
}

function editarSessao(id){
  editingSessionId = id;
  abrirModalSessao();
}

function abrirModalSessao(){
  const s = editingSessionId ? sessoes.find(x=>x.id===editingSessionId) : null;
  const itens = s ? s.itens : [{tipo:'avulso', quantidade:1}];

  document.getElementById('modalBody').innerHTML = `
    <h3>${s ? 'Editar sessão' : 'Nova sessão'}</h3>
    <div class="field">
      <label>Cliente</label>
      <select id="f_cliente">
        <option value="">Selecione...</option>
        ${clientes.map(c=>`<option value="${c.id}" data-nome="${c.nome}" ${s && s.clienteId===c.id ? 'selected':''}>${c.nome}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Data</label>
      <input type="date" id="f_data" value="${s ? s.data : new Date().toISOString().slice(0,10)}">
    </div>

    <label>Itens da sessão</label>
    <div id="itemsContainer"></div>
    <button class="btn ghost small" onclick="addItemRow()">+ Adicionar item</button>

    <div class="checkline">
      <input type="checkbox" id="f_irma" ${!s || s.irmaParticipou ? 'checked':''}>
      <label style="margin:0;">Irmã participou dessa sessão? (se desmarcado, repasse zera)</label>
    </div>

    <div class="session-total" id="sessionTotal"></div>

    <div class="field" style="margin-top:14px;">
      <label>Status de pagamento</label>
      <select id="f_status">
        <option value="pendente" ${s && s.statusPagamento==='pendente' ? 'selected':''}>Pendente</option>
        <option value="pago" ${s && s.statusPagamento==='pago' ? 'selected':''}>Pago</option>
        <option value="depois" ${s && s.statusPagamento==='depois' ? 'selected':''}>Vai pagar depois</option>
      </select>
    </div>
    <div class="field">
      <label>Forma de pagamento</label>
      <select id="f_forma">
        <option value="">-</option>
        <option value="pix" ${s && s.formaPagamento==='pix' ? 'selected':''}>Pix</option>
        <option value="dinheiro" ${s && s.formaPagamento==='dinheiro' ? 'selected':''}>Dinheiro</option>
      </select>
    </div>

    <div class="modal-actions">
      ${s ? `<button class="btn danger" onclick="excluirSessao('${s.id}')">Excluir</button>` : ''}
      <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn" onclick="salvarSessao()">Salvar</button>
    </div>
  `;

  itemCount = 0;
  document.getElementById('itemsContainer').innerHTML = '';
  itens.forEach(it=>addItemRow(it));
  atualizarTotalSessao();
  abrirModal();
}

function addItemRow(existente){
  const id = 'item_'+(itemCount++);
  const tipo = existente ? existente.tipo : 'avulso';
  const qtd = existente ? existente.quantidade : 1;
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = id;
  div.innerHTML = `
    <div>
      <label>Tipo</label>
      <select class="item-tipo" onchange="atualizarTotalSessao()">
        <option value="avulso" ${tipo==='avulso'?'selected':''}>Look avulso (R$35)</option>
        <option value="pacote3" ${tipo==='pacote3'?'selected':''}>Pacote 3 looks (R$100/grupo)</option>
        <option value="reels" ${tipo==='reels'?'selected':''}>Reels (R$60)</option>
      </select>
    </div>
    <div>
      <label>Qtd</label>
      <input type="number" class="item-qtd" min="1" value="${qtd}" oninput="atualizarTotalSessao()">
    </div>
    <div>
      <label>Subtotal</label>
      <div class="calc item-calc">R$ 0,00</div>
    </div>
    <button class="remove-item" onclick="document.getElementById('${id}').remove(); atualizarTotalSessao();">✕</button>
  `;
  document.getElementById('itemsContainer').appendChild(div);
  atualizarTotalSessao();
}

function atualizarTotalSessao(){
  const rows = document.querySelectorAll('#itemsContainer .item-row');
  let totalValor = 0, totalRepasse = 0;
  const irmaChk = document.getElementById('f_irma');
  const irmaParticipou = irmaChk ? irmaChk.checked : true;

  rows.forEach(row=>{
    const tipo = row.querySelector('.item-tipo').value;
    const qtd = row.querySelector('.item-qtd').value;
    const {valor, repasse} = calcularItem(tipo, qtd);
    row.querySelector('.item-calc').textContent = fmt(valor);
    totalValor += valor;
    totalRepasse += irmaParticipou ? repasse : 0;
  });

  const totalEl = document.getElementById('sessionTotal');
  if(totalEl){
    totalEl.innerHTML = `<span>Total da sessão</span><span><b>${fmt(totalValor)}</b> · repasse: ${fmt(totalRepasse)}</span>`;
  }
}
if(document.getElementById('f_irma')===null){
  // listener adicionado dinamicamente no modal
}
document.addEventListener('change', e=>{
  if(e.target && e.target.id==='f_irma') atualizarTotalSessao();
});

function salvarSessao(){
  const clienteSel = document.getElementById('f_cliente');
  const clienteId = clienteSel.value;
  if(!clienteId){ alert('Selecione um cliente.'); return; }
  const clienteNome = clienteSel.selectedOptions[0].dataset.nome;
  const data = document.getElementById('f_data').value;
  const irmaParticipou = document.getElementById('f_irma').checked;
  const statusPagamento = document.getElementById('f_status').value;
  const formaPagamento = document.getElementById('f_forma').value;

  const rows = document.querySelectorAll('#itemsContainer .item-row');
  const itens = [];
  let valorTotal = 0, repasseTotal = 0;
  rows.forEach(row=>{
    const tipo = row.querySelector('.item-tipo').value;
    const quantidade = Number(row.querySelector('.item-qtd').value)||0;
    const {valor, repasse} = calcularItem(tipo, quantidade);
    itens.push({tipo, quantidade, valor});
    valorTotal += valor;
    repasseTotal += irmaParticipou ? repasse : 0;
  });

  const payload = {clienteId, clienteNome, data, itens, valorTotal, repasseTotal, irmaParticipou, statusPagamento, formaPagamento};

  const promise = editingSessionId
    ? db.collection('sessoes').doc(editingSessionId).update(payload)
    : db.collection('sessoes').add(payload);

  promise.then(()=>fecharModal()).catch(err=>alert('Erro ao salvar: '+err.message));
}

function excluirSessao(id){
  if(confirm('Excluir essa sessão?')){
    db.collection('sessoes').doc(id).delete().then(fecharModal);
  }
}

/* ---------- CLIENTES ---------- */
function renderClientes(){
  return `
    <div class="panel">
      <div class="panel-head"><h3>Clientes cadastrados</h3><button class="btn" onclick="abrirNovoCliente()">+ Novo cliente</button></div>
      ${clientes.length ? `
        <table>
          <tr><th>Nome</th><th>Telefone</th><th>Pasta no Drive</th><th></th></tr>
          ${clientes.map(c=>`
            <tr>
              <td>${c.nome}</td>
              <td>${c.telefone||'-'}</td>
              <td>${c.driveFolderLink ? `<a class="drivebtn" href="${c.driveFolderLink}" target="_blank">📁 Abrir pasta</a>` : '<span style="color:var(--muted)">sem pasta ainda</span>'}</td>
              <td><button class="btn ghost small" onclick="editarCliente('${c.id}')">Editar</button></td>
            </tr>`).join('')}
        </table>
      ` : `<div class="empty"><div class="serif">Nenhum cliente cadastrado</div>Cadastre o primeiro cliente fixo da Rafaela.</div>`}
    </div>
  `;
}

let editingClientId = null;

function abrirNovoCliente(){
  editingClientId = null;
  abrirModalCliente();
}
function editarCliente(id){
  editingClientId = id;
  abrirModalCliente();
}
function abrirModalCliente(){
  const c = editingClientId ? clientes.find(x=>x.id===editingClientId) : null;
  document.getElementById('modalBody').innerHTML = `
    <h3>${c ? 'Editar cliente' : 'Novo cliente'}</h3>
    <div class="field"><label>Nome</label><input type="text" id="c_nome" value="${c?c.nome:''}"></div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="tel" id="c_telefone" value="${c?c.telefone||'':''}"></div>
    <div class="field">
      <label>Link da pasta no Drive</label>
      <input type="text" id="c_drive" placeholder="Cole aqui o link da pasta (crie manualmente por enquanto)" value="${c?c.driveFolderLink||'':''}">
    </div>
    <div class="modal-actions">
      ${c ? `<button class="btn danger" onclick="excluirCliente('${c.id}')">Excluir</button>` : ''}
      <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn" onclick="salvarCliente()">Salvar</button>
    </div>
  `;
  abrirModal();
}
function salvarCliente(){
  const nome = document.getElementById('c_nome').value.trim();
  if(!nome){ alert('Informe o nome do cliente.'); return; }
  const payload = {
    nome,
    telefone: document.getElementById('c_telefone').value.trim(),
    driveFolderLink: document.getElementById('c_drive').value.trim()
  };
  const promise = editingClientId
    ? db.collection('clientes').doc(editingClientId).update(payload)
    : db.collection('clientes').add(payload);
  promise.then(fecharModal).catch(err=>alert('Erro: '+err.message));
}
function excluirCliente(id){
  if(confirm('Excluir esse cliente? Sessões já lançadas não serão apagadas.')){
    db.collection('clientes').doc(id).delete().then(fecharModal);
  }
}

/* ---------- IDAS AO BRÁS ---------- */
function renderBras(){
  const im = idasDoMes();
  const total = im.length * VALOR_IDA_BRAS;
  return `
    <div class="cards">
      <div class="card"><div class="label">Idas registradas no mês</div><div class="value">${im.length}</div></div>
      <div class="card wine"><div class="label">Custo total do mês</div><div class="value">${fmt(total)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Idas ao Brás</h3><button class="btn" onclick="abrirNovaIda()">+ Registrar ida</button></div>
      ${im.length ? `
        <table>
          <tr><th>Data</th><th>Observação</th><th>Valor</th><th></th></tr>
          ${im.map(i=>`
            <tr>
              <td>${fmtData(i.data)}</td>
              <td>${i.observacao||'-'}</td>
              <td>${fmt(VALOR_IDA_BRAS)}</td>
              <td><button class="btn ghost small" onclick="excluirIda('${i.id}')">Excluir</button></td>
            </tr>`).join('')}
        </table>
      ` : `<div class="empty"><div class="serif">Nenhuma ida registrada esse mês</div>Lança geralmente segunda e terça de madrugada.</div>`}
    </div>
  `;
}
function abrirNovaIda(){
  document.getElementById('modalBody').innerHTML = `
    <h3>Registrar ida ao Brás</h3>
    <div class="field"><label>Data</label><input type="date" id="i_data" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Observação (opcional)</label><input type="text" id="i_obs" placeholder="ex: atendeu 4 clientes"></div>
    <div class="field"><label>Valor fixo</label><input type="text" value="${fmt(VALOR_IDA_BRAS)}" disabled></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn" onclick="salvarIda()">Salvar</button>
    </div>
  `;
  abrirModal();
}
function salvarIda(){
  const data = document.getElementById('i_data').value;
  const observacao = document.getElementById('i_obs').value.trim();
  db.collection('idasBras').add({data, observacao, valor:VALOR_IDA_BRAS}).then(fecharModal);
}
function excluirIda(id){
  if(confirm('Excluir essa ida?')) db.collection('idasBras').doc(id).delete();
}

/* ---------- FINANCEIRO ---------- */
function renderFinanceiro(){
  const sm = sessoesDoMes();
  const pendentes = sm.filter(s=>s.statusPagamento!=='pago');
  const emAberto = pendentes.reduce((a,s)=>a+(s.valorTotal||0),0);

  // agrupado por cliente
  const porCliente = {};
  pendentes.forEach(s=>{
    porCliente[s.clienteNome] = (porCliente[s.clienteNome]||0) + s.valorTotal;
  });

  return `
    <div class="cards">
      <div class="card danger"><div class="label">Total em aberto</div><div class="value" style="color:var(--danger)">${fmt(emAberto)}</div></div>
      <div class="card"><div class="label">Sessões pendentes</div><div class="value">${pendentes.length}</div></div>
    </div>
    <div class="panel">
      <h3>Clientes devendo</h3>
      ${Object.keys(porCliente).length ? `
        <table>
          <tr><th>Cliente</th><th>Valor em aberto</th></tr>
          ${Object.entries(porCliente).map(([nome,valor])=>`<tr><td>${nome}</td><td>${fmt(valor)}</td></tr>`).join('')}
        </table>
      ` : `<div class="empty"><div class="serif">Ninguém devendo esse mês 🎉</div></div>`}
    </div>
    <div class="panel">
      <h3>Detalhe das sessões pendentes</h3>
      ${pendentes.length ? `
        <table>
          <tr><th>Data</th><th>Cliente</th><th>Valor</th><th>Status</th><th></th></tr>
          ${pendentes.map(s=>`
            <tr>
              <td>${fmtData(s.data)}</td>
              <td>${s.clienteNome}</td>
              <td>${fmt(s.valorTotal)}</td>
              <td>${statusTag(s.statusPagamento)}</td>
              <td><button class="btn small" onclick="marcarComoPago('${s.id}')">Marcar como pago</button></td>
            </tr>`).join('')}
        </table>
      ` : ''}
    </div>
  `;
}
function marcarComoPago(id){
  db.collection('sessoes').doc(id).update({statusPagamento:'pago'});
}
