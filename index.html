<title>Studio Rafaela — Controle</title>

<style>
  :root{
    --ink:#211d1b;
    --paper:#faf6f1;
    --surface:#ffffff;
    --blush:#f3e3dc;
    --wine:#8a3a42;
    --wine-dark:#6e2e35;
    --gold:#b08a4e;
    --line:#e7ddd3;
    --muted:#8a7f76;
    --ok:#3f7d54;
    --warn:#b3762c;
    --danger:#a13b3b;
    --radius:14px;
    --shadow: 0 2px 10px rgba(33,29,27,0.06), 0 1px 2px rgba(33,29,27,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:var(--paper);}
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;
    background:right center/cover no-repeat;
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;
    background:linear-gradient(90deg, rgba(250,246,241,0.55) 0%, rgba(250,246,241,0.2) 45%, rgba(250,246,241,0.15) 100%);
  }
  h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* Layout */
  .app{display:flex;min-height:100vh;}
  nav.side{
    width:220px;background:var(--ink);color:#f2ece6;padding:28px 18px;
    display:flex;flex-direction:column;gap:6px;position:fixed;top:0;bottom:0;
  }
  nav.side .brand{font-family:'Playfair Display',serif;font-size:22px;font-style:italic;margin-bottom:28px;color:#fff;}
  nav.side .brand span{color:var(--gold);}
  nav.side button{
    background:none;border:none;color:#cfc4ba;text-align:left;padding:11px 12px;border-radius:10px;
    font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:10px;transition:.15s;
  }
  nav.side button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  nav.side button.active{background:var(--wine);color:#fff;}

  .side-footer{
    margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .side-footer img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--gold);}
  .side-footer div{display:flex;flex-direction:column;line-height:1.3;}
  .side-footer b{color:#fff;font-size:13.5px;}
  .side-footer span{color:#9c9088;font-size:11.5px;}

  .hero{
    display:flex;background:rgba(255,255,255,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.6);border-radius:20px;overflow:hidden;margin-bottom:26px;box-shadow:var(--shadow);
    min-height:150px;
  }
  .hero-text{flex:1;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;}
  .hero-text .eyebrow{color:var(--wine);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .hero-text h2{font-size:32px;margin:0 0 6px;font-style:italic;color:var(--ink);}
  .hero-text p{margin:0;color:var(--muted);font-size:14px;}

  main{margin-left:220px;flex:1;padding:32px 40px 100px;max-width:980px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:26px;margin:0;font-weight:700;}
  .topbar .sub{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .month-picker{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;}
  .month-picker input{border:none;outline:none;background:none;font-weight:600;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px;}
  .card{background:rgba(255,255,255,0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.7);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
  .card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .card .value{font-size:24px;font-weight:700;}
  .card.wine .value{color:var(--wine);}
  .card.ok .value{color:var(--ok);}
  .card.warn .value{color:var(--warn);}

  .panel{background:rgba(255,255,255,0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.7);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:22px;}
  .panel h3{margin:0 0 16px;font-size:17px;font-weight:700;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}

  .btn{background:var(--wine);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;}
  .btn:hover{background:var(--wine-dark);}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn.danger{background:none;color:var(--danger);border:1px solid #e6cccc;}

  table{width:100%;border-collapse:collapse;font-size:13.8px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .tag.pago{background:#e3f1e6;color:var(--ok);}
  .tag.pendente{background:#faeada;color:var(--warn);}
  .tag.depois{background:#f1e6e6;color:var(--danger);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid.wide{grid-template-columns:1fr;}
  label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--paper);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--wine);outline-offset:1px;}
  .field{margin-bottom:14px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:10px 0;}
  .checkline input{width:auto;}

  .item-row{display:grid;grid-template-columns:1.3fr 0.8fr 0.9fr auto;gap:10px;align-items:end;margin-bottom:10px;padding:12px;background:var(--blush);border-radius:10px;}
  .item-row .calc{font-weight:700;color:var(--wine);font-size:14px;}
  .remove-item{background:none;border:none;color:var(--danger);font-size:18px;padding:4px;}

  .session-total{display:flex;justify-content:space-between;background:var(--blush);padding:14px 18px;border-radius:10px;margin-top:8px;font-size:15px;}
  .session-total b{color:var(--wine);}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .serif{font-size:19px;color:var(--ink);margin-bottom:6px;}

  .modal-bg{position:fixed;inset:0;background:rgba(33,29,27,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .drivebtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--wine);text-decoration:none;font-weight:600;}
  .wa-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:#25D366;border-radius:50%;margin-left:8px;vertical-align:middle;transition:.15s;}
  .wa-btn:hover{background:#1ebe5b;transform:scale(1.08);}

  /* Mobile */
  nav.side.mobile-hidden{display:none;}
  .bottom-nav{display:none;}
  @media (max-width: 880px){
    nav.side{display:none;}
    main{margin-left:0;padding:20px 16px 90px;}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);z-index:40;
      justify-content:space-around;padding:8px 4px 14px;
    }
    .bottom-nav button{background:none;border:none;color:#cfc4ba;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;padding:6px 4px;}
    .bottom-nav button.active{color:#fff;}
    .bottom-nav button .dot{width:5px;height:5px;border-radius:50%;background:var(--wine);opacity:0;}
    .bottom-nav button.active .dot{opacity:1;}
    .form-grid{grid-template-columns:1fr;}
    .item-row{grid-template-columns:1fr 1fr;grid-template-areas:"tipo tipo" "qtd calc" "remove remove";}
    .cards{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="app">
  <nav class="side" id="sideNav">
    <div class="brand">studio <span>Rafaela</span></div>
    <button data-view="dashboard" class="nav-btn active">📊 Dashboard</button>
    <button data-view="sessoes" class="nav-btn">📸 Sessões</button>
    <button data-view="clientes" class="nav-btn">👥 Clientes</button>
    <button data-view="bras" class="nav-btn">🌙 Idas ao Brás</button>
    <button data-view="custos" class="nav-btn">⛽ Custos Extras</button>
    <button data-view="financeiro" class="nav-btn">💰 Financeiro</button>
    <button data-view="config" class="nav-btn">⚙️ Configurações</button>
    <div class="side-footer">
      <img class="avatar-img" alt="Rafaela">
      <div><b>Rafaela</b><span>Studio Owner</span></div>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="sub" id="viewSub">Visão geral do mês</div>
      </div>
      <div class="month-picker">
        <span>📅</span>
        <input type="month" id="monthFilter">
      </div>
    </div>

    <div id="viewRoot"></div>
  </main>
</div>

<div class="bottom-nav" id="bottomNav">
  <button data-view="dashboard" class="nav-btn active"><span>📊</span>Home<span class="dot"></span></button>
  <button data-view="sessoes" class="nav-btn"><span>📸</span>Sessões<span class="dot"></span></button>
  <button data-view="clientes" class="nav-btn"><span>👥</span>Clientes<span class="dot"></span></button>
  <button data-view="bras" class="nav-btn"><span>🌙</span>Brás<span class="dot"></span></button>
  <button data-view="custos" class="nav-btn"><span>⛽</span>Custos<span class="dot"></span></button>
  <button data-view="financeiro" class="nav-btn"><span>💰</span>Financ.<span class="dot"></span></button>
</div>

<!-- Modal genérico -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>

const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let driveAccessToken = null;
let driveTokenClient = null;

function initDriveTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) return false;
  if(driveTokenClient) return true;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp && resp.access_token){
        driveAccessToken = resp.access_token;
        localStorage.setItem('driveWasConnected','1');
        render();
      }
    }
  });
  return true;
}

function conectarDrive(){
  if(!initDriveTokenClient()){
    alert('O Google ainda está carregando, espera 1 segundo e tenta de novo.');
    return;
  }
  driveTokenClient.requestAccessToken({prompt: 'consent'});
}

function driveConectado(){ return !!driveAccessToken; }

function tentarReconectarDriveSilencioso(){
  if(localStorage.getItem('driveWasConnected')==='1'){
    setTimeout(()=>{
      if(initDriveTokenClient()){
        try{ driveTokenClient.requestAccessToken({prompt:''}); }catch(e){}
      }
    }, 800);
  }
}

async function criarPastaDrive(nome, parentId){
  if(!driveAccessToken) throw new Error('Drive não conectado');
  const metadata = { name: nome, mimeType: 'application/vnd.google-apps.folder' };
  if(parentId) metadata.parents = [parentId];
  const res = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method:'POST',
    headers: { 'Authorization': 'Bearer ' + driveAccessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify(metadata)
  });
  const data = await res.json();
  if(!data.id) throw new Error((data.error && data.error.message) || 'Erro ao criar pasta no Drive');
  try{
    await fetch(`https://www.googleapis.com/drive/v3/files/${data.id}/permissions`, {
      method:'POST',
      headers: {'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'},
      body: JSON.stringify({role:'reader', type:'anyone'})
    });
  }catch(e){}
  return { id: data.id, link: `https://drive.google.com/drive/folders/${data.id}` };
}

const PRECO_LOOK = 35;
const PRECO_LOOK_EXTERNO = 40;
const PRECO_PACOTE3 = 100;
const PRECO_REELS = 60;
const REPASSE_POR_LOOK = 5;
const VALOR_IDA_BRAS = 100;

/* =========================================================
   CÁLCULO DE PREÇOS (regra de negócio)
   ========================================================= */
function calcularItem(tipo, qtd){
  qtd = Number(qtd)||0;
  let valor = 0, repasse = 0;
  if(tipo === 'avulso'){
    valor = qtd * PRECO_LOOK;
    repasse = qtd * REPASSE_POR_LOOK;
  } else if(tipo === 'pacote3'){
    const grupos = Math.floor(qtd/3);
    const resto = qtd%3;
    valor = grupos*PRECO_PACOTE3 + resto*PRECO_LOOK;
    repasse = qtd * REPASSE_POR_LOOK;
  } else if(tipo === 'externo'){
    valor = qtd * PRECO_LOOK_EXTERNO;
    repasse = qtd * REPASSE_POR_LOOK;
  } else if(tipo === 'reels'){
    valor = qtd * PRECO_REELS;
    repasse = 0; // reels nunca gera repasse pra irmã
  }
  return {valor, repasse};
}

function fmt(v){
  return 'R$ ' + (v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

  db.collection('sessoes').orderBy('data','desc').onSnapshot(snap=>{
    sessoes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('idasBras').orderBy('data','desc').onSnapshot(snap=>{
    idasBras = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  db.collection('custosExtras').orderBy('data','desc').onSnapshot(snap=>{
    custosExtras = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
}

  const pendentes = sm.filter(s=>s.statusPagamento!=='pago');

      <div class="card"><div class="label">Custo fixo — Idas ao Brás</div><div class="value">${fmt(custoBras)}</div></div>
      <div class="card"><div class="label">Custos extras (gasolina, pedágio...)</div><div class="value">${fmt(custoExtra)}</div></div>
      <div class="card ${lucro < 0 ? 'danger' : 'ok'}"><div class="label">Lucro líquido</div><div class="value" style="color:${lucro < 0 ? 'var(--danger)' : 'var(--ok)'}">${fmt(lucro)}</div></div>
      <div class="card warn"><div class="label">Em aberto (${pendentes.length} sessões)</div><div class="value">${fmt(emAberto)}</div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Últimas sessões</h3><button class="btn small" onclick="abrirNovaSessao()">+ Nova sessão</button></div>
      ${ultimas.length ? `
        <table>
          <tr><th>Data</th><th>Cliente</th><th>Itens</th><th>Valor</th><th>Repasse</th><th>Status</th></tr>
          ${ultimas.map(s=>`
            <tr>

              <td>${(s.itens||[]).map(i=>tipoLabel(i.tipo)+' x'+i.quantidade).join(', ')} ${s.sessionDriveLink ? `<a href="${s.sessionDriveLink}" target="_blank" title="Abrir pasta da sessão">📁</a>` : ''}</td>

  `;
}

function tipoLabel(t){
  return {avulso:'Look avulso', pacote3:'Pacote 3x', externo:'Look externo', reels:'Reels'}[t] || t;
}
function fmtData(d){
  if(!d) return '-';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function statusTag(s){
  if(s==='pago') return `<span class="tag pago">Pago</span>`;
  if(s==='depois') return `<span class="tag depois">Vai pagar depois</span>`;
  return `<span class="tag pendente">Pendente</span>`;
}

async function salvarClienteInlineNaSessao(){
  const nome = document.getElementById('nci_nome').value.trim();
  if(!nome){ alert('Informe o nome do cliente.'); return; }
  const telefone = document.getElementById('nci_telefone').value.trim();
  try{
    const ref = await db.collection('clientes').add({nome, telefone, driveFolderLink:''});
    // adiciona localmente sem esperar o listener, pra não perder o preenchimento da sessão em andamento
    clientes.push({id: ref.id, nome, telefone, driveFolderLink:''});
    const select = document.getElementById('f_cliente');
    const opt = document.createElement('option');
    opt.value = ref.id;
    opt.dataset.nome = nome;
    opt.textContent = nome;
    opt.selected = true;
    select.appendChild(opt);
    document.getElementById('nci_nome').value = '';
    document.getElementById('nci_telefone').value = '';
    mostrarNovoClienteInline();
    if(driveConectado()){
      try{
        const pasta = await criarPastaDrive(nome);
        await db.collection('clientes').doc(ref.id).update({driveFolderId: pasta.id, driveFolderLink: pasta.link});
      }catch(e){ console.error('Erro ao criar pasta automática:', e); }
    }
  }catch(e){
    alert('Erro ao cadastrar cliente: '+e.message);
  }
}

function atualizarTotalSessao(){
  const rows = document.querySelectorAll('#itemsContainer .item-row');
  let totalValor = 0, totalRepasse = 0;
  const irmaChk = document.getElementById('f_irma');
  const irmaParticipou = irmaChk ? irmaChk.checked : true;

  rows.forEach(row=>{
    const tipo = row.querySelector('.item-tipo').value;
    const qtd = row.querySelector('.item-qtd').value;
    const {valor, repasse} = calcularItem(tipo, qtd);
    row.querySelector('.item-calc').textContent = fmt(valor);
    totalValor += valor;
    totalRepasse += irmaParticipou ? repasse : 0;
  });

  const totalEl = document.getElementById('sessionTotal');
  if(totalEl){
    totalEl.innerHTML = `<span>Total da sessão</span><span><b>${fmt(totalValor)}</b> · repasse: ${fmt(totalRepasse)}</span>`;
  }
}

  const formaPagamento = document.getElementById('f_forma').value;

  const rows = document.querySelectorAll('#itemsContainer .item-row');
  const itens = [];
  let valorTotal = 0, repasseTotal = 0;
  rows.forEach(row=>{
    const tipo = row.querySelector('.item-tipo').value;
    const quantidade = Number(row.querySelector('.item-qtd').value)||0;
    const {valor, repasse} = calcularItem(tipo, quantidade);
    itens.push({tipo, quantidade, valor});
    valorTotal += valor;
    repasseTotal += irmaParticipou ? repasse : 0;
  });

  const payload = {clienteId, clienteNome, data, itens, valorTotal, repasseTotal, irmaParticipou, statusPagamento, formaPagamento};

  const isNova = !editingSessionId;
  const promise = editingSessionId
    ? db.collection('sessoes').doc(editingSessionId).update(payload)
    : db.collection('sessoes').add(payload);

  promise.then((ref)=>{
    fecharModal();
    const sessaoId = isNova ? ref.id : editingSessionId;
    criarSubpastaSessao(sessaoId, clienteId, data);
  }).catch(err=>alert('Erro ao salvar: '+err.message));
}

function extrairFolderId(link){
  if(!link) return null;
  const m = link.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function getClienteFolderId(clienteId){
  const c = clientes.find(x=>x.id===clienteId);
  if(!c) return null;
  return c.driveFolderId || extrairFolderId(c.driveFolderLink);
}
function fmtDataPasta(d){
  if(!d) return 'sessao';
  const [y,m,day] = d.split('-');
  return `${day}-${m}-${y}`;
}
async function criarSubpastaSessao(sessaoId, clienteId, data){
  if(!driveConectado()) return;
  const parentId = getClienteFolderId(clienteId);
  if(!parentId) return;
  try{
    const pasta = await criarPastaDrive(fmtDataPasta(data), parentId);
    await db.collection('sessoes').doc(sessaoId).update({sessionDriveLink: pasta.link});
  }catch(e){ console.error('Erro ao criar subpasta da sessão:', e); }
}

function excluirSessao(id){
  if(confirm('Excluir essa sessão?')){
    db.collection('sessoes').doc(id).delete().then(fecharModal);
  }
}

  const comDDI = digitos.startsWith('55') ? digitos : '55'+digitos;
  return `https://wa.me/${comDDI}`;
}

async function criarPastaParaCliente(clienteId, nome){
  if(!driveConectado()){ alert('Conecta o Google Drive primeiro, na tela de Configurações.'); return; }
  try{
    const pasta = await criarPastaDrive(nome);
    await db.collection('clientes').doc(clienteId).update({driveFolderId: pasta.id, driveFolderLink: pasta.link});
  }catch(e){
    alert('Erro ao criar pasta no Drive: '+e.message);

let editingClientId = null;

function abrirNovoCliente(){
  editingClientId = null;
  abrirModalCliente();
}
function editarCliente(id){
  editingClientId = id;
  abrirModalCliente();
}
function abrirModalCliente(){
  const c = editingClientId ? clientes.find(x=>x.id===editingClientId) : null;
  document.getElementById('modalBody').innerHTML = `
    <h3>${c ? 'Editar cliente' : 'Novo cliente'}</h3>
    <div class="field"><label>Nome</label><input type="text" id="c_nome" value="${c?c.nome:''}"></div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="tel" id="c_telefone" value="${c?c.telefone||'':''}"></div>
    <div class="field">
      <label>Link da pasta no Drive</label>
      <input type="text" id="c_drive" placeholder="Cole aqui o link da pasta (crie manualmente por enquanto)" value="${c?c.driveFolderLink||'':''}">
    </div>
    <div class="modal-actions">
      ${c ? `<button class="btn danger" onclick="excluirCliente('${c.id}')">Excluir</button>` : ''}
      <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn" onclick="salvarCliente()">Salvar</button>
    </div>
  `;
  abrirModal();
}
function salvarCliente(){
  const nome = document.getElementById('c_nome').value.trim();
  if(!nome){ alert('Informe o nome do cliente.'); return; }
  const isNovo = !editingClientId;
  const payload = {
    nome,
    telefone: document.getElementById('c_telefone').value.trim(),
    driveFolderLink: document.getElementById('c_drive').value.trim()
  };
  const promise = editingClientId
    ? db.collection('clientes').doc(editingClientId).update(payload)
    : db.collection('clientes').add(payload);

  promise.then(async (ref)=>{
    fecharModal();
    if(isNovo && driveConectado() && !payload.driveFolderLink){
      try{
        const pasta = await criarPastaDrive(nome);
        await db.collection('clientes').doc(ref.id).update({driveFolderId: pasta.id, driveFolderLink: pasta.link});
      }catch(e){ console.error('Erro ao criar pasta automática:', e); }
    }
  }).catch(err=>alert('Erro: '+err.message));
}
function excluirCliente(id){
  if(confirm('Excluir esse cliente? Sessões já lançadas não serão apagadas.')){
    db.collection('clientes').doc(id).delete().then(fecharModal);
  }
}

/* ---------- FINANCEIRO ---------- */
function renderFinanceiro(){
  const sm = sessoesDoMes();
  const pendentes = sm.filter(s=>s.statusPagamento!=='pago');
  const emAberto = pendentes.reduce((a,s)=>a+(s.valorTotal||0),0);

  // agrupado por cliente
  const porCliente = {};
  pendentes.forEach(s=>{
    porCliente[s.clienteNome] = (porCliente[s.clienteNome]||0) + s.valorTotal;
  });

  return `
    <div class="cards">
      <div class="card danger"><div class="label">Total em aberto</div><div class="value" style="color:var(--danger)">${fmt(emAberto)}</div></div>
      <div class="card"><div class="label">Sessões pendentes</div><div class="value">${pendentes.length}</div></div>
    </div>
    <div class="panel">
      <h3>Clientes devendo</h3>
      ${Object.keys(porCliente).length ? `
        <table>
          <tr><th>Cliente</th><th>Valor em aberto</th></tr>
          ${Object.entries(porCliente).map(([nome,valor])=>`<tr><td>${nome}</td><td>${fmt(valor)}</td></tr>`).join('')}
        </table>
      ` : `<div class="empty"><div class="serif">Ninguém devendo esse mês 🎉</div></div>`}
    </div>
    <div class="panel">
      <h3>Detalhe das sessões pendentes</h3>
      ${pendentes.length ? `
        <table>
          <tr><th>Data</th><th>Cliente</th><th>Valor</th><th>Status</th><th></th></tr>
          ${pendentes.map(s=>`
            <tr>
              <td>${fmtData(s.data)}</td>
              <td>${s.clienteNome}</td>
              <td>${fmt(s.valorTotal)}</td>
              <td>${statusTag(s.statusPagamento)}</td>
              <td><button class="btn small" onclick="marcarComoPago('${s.id}')">Marcar como pago</button></td>
            </tr>`).join('')}
        </table>
      ` : ''}
    </div>
  `;
}
function marcarComoPago(id){
  db.collection('sessoes').doc(id).update({statusPagamento:'pago'});
}
